name: Verify production pull request source

on:
  pull_request_target:
    branches:
      - production
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-source-branch:
    name: Verify source branch
    runs-on: ubuntu-latest
    env:
      PULL_REQUEST_SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Reject an unexpected source branch
        shell: bash
        run: |
          case "$PULL_REQUEST_SOURCE_BRANCH" in
            main|master)
              ;;
            *)
              echo "::error::Pull requests to production must originate from main or master; received $PULL_REQUEST_SOURCE_BRANCH."
              exit 1
              ;;
          esac
